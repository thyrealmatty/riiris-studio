<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BabyRiiri — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: 'Nunito', system-ui, sans-serif;
        background: #FAF7F2;
        color: #241E30;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card {
        padding: 32px;
        max-width: 320px;
      }
      .badge {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: #EDE9FE;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 36px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: rgba(36, 30, 48, 0.6);
        line-height: 1.5;
        margin: 0;
      }
      button {
        margin-top: 24px;
        background: #8B7CF6;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">🎵</div>
      <h1>You're offline</h1>
      <p>BabyRiiri needs an internet connection to load new music right now. Anything you've already opened may still be available.</p>
      <button onclick="location.reload()">Try Again</button>
    </div>
  </body>
</html>
